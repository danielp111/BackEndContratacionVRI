spring.application.name=contratacion-vri
server.port=${SERVER_PORT:8080}

# Base de datos MySQL (levantada con docker compose; ver docker-compose.yml)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contratacion_vri}?serverTimezone=America/Bogota&characterEncoding=UTF-8&connectionCollation=utf8mb4_0900_ai_ci
spring.datasource.username=${DB_USER:vri}
spring.datasource.password=${DB_PASSWORD:vri_dev_2026}

# JPA / Hibernate
# "update" solo para el proyecto base; cuando existan migraciones (Flyway) pasar a "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Carga inicial (data.sql): series documentales, tipos de contrato y consecutivos 2026.
# Corre en cada arranque, después de que Hibernate crea o actualiza las tablas; es idempotente
# (INSERT IGNORE con ids fijos). Antes de producción: Flyway y ddl-auto=validate.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true

# Código SIRECI del ítem del catálogo TIPO_IDENTIFICACION que corresponde al NIT.
# Con ese tipo el sistema calcula el DV y lo prohíbe para personas naturales. Confirmado por la lista
# "TIPO DE DOCUMENTO" de la hoja CONTROL del libro de contratación (fila 348: "1 NIT").
vri.tipo-identificacion.codigo-nit=1

# Fechas en JSON como AAAA-MM-DD
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
