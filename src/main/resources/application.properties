spring.application.name=contratacion-vri
server.port=${SERVER_PORT:8080}

# Base de datos MySQL (levantada con docker compose; ver docker-compose.yml)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:contratacion_vri}?serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:vri}
spring.datasource.password=${DB_PASSWORD:vri_dev_2026}

# JPA / Hibernate
# "update" solo para el proyecto base; cuando existan migraciones (Flyway) pasar a "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# Código SIRECI del ítem del catálogo TIPO_IDENTIFICACION que corresponde al NIT.
# Con ese tipo el sistema calcula el DV y lo prohíbe para personas naturales. POR CONFIRMAR con la VRI.
vri.tipo-identificacion.codigo-nit=1

# Fechas en JSON como AAAA-MM-DD
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
