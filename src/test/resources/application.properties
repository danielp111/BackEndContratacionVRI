# Pruebas: base H2 en memoria en modo MySQL, no requiere el contenedor de Docker.
# LOCK_TIMEOUT de 10 s: las pruebas de concurrencia dejan a varias transacciones esperando el
# SELECT ... FOR UPDATE del consecutivo; el valor por defecto de H2 (1 s) las haría fallar.
spring.datasource.url=jdbc:h2:mem:contratacion_vri;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Las pruebas crean sus propios datos; la carga inicial (data.sql) se prueba aparte en CargaInicialTest,
# que la activa. Este archivo reemplaza por completo al de src/main, por eso se repiten estas dos:
# sin defer, data.sql correría antes de que Hibernate cree las tablas.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
